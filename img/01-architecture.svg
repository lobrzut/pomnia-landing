<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="880" height="420" fill="#06070d"/>

  <!-- title -->
  <text x="40" y="46" fill="#9aa3bd" font-size="12" letter-spacing="1.6">ONE VAULT · MANY AGENTS</text>

  <!-- ── column 1: assistants ── -->
  <text x="40" y="92" fill="#5b6178" font-size="11" letter-spacing="1.2">READ FROM</text>
  <g>
    <rect x="40" y="106" width="176" height="34" rx="8" fill="#0a0c16" stroke="rgba(148,163,216,0.18)"/>
    <text x="58" y="128" fill="#e9ecf5" font-size="13">Claude Code</text>
    <rect x="40" y="148" width="176" height="34" rx="8" fill="#0a0c16" stroke="rgba(148,163,216,0.18)"/>
    <text x="58" y="170" fill="#e9ecf5" font-size="13">Cursor</text>
    <rect x="40" y="190" width="176" height="34" rx="8" fill="#0a0c16" stroke="rgba(148,163,216,0.18)"/>
    <text x="58" y="212" fill="#e9ecf5" font-size="13">Claude Desktop</text>
    <rect x="40" y="232" width="176" height="34" rx="8" fill="#0a0c16" stroke="rgba(148,163,216,0.18)"/>
    <text x="58" y="254" fill="#e9ecf5" font-size="13">Antigravity</text>
  </g>

  <!-- arrow 1 -->
  <path d="M228 186 L286 186" stroke="#6366f1" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <text x="232" y="176" fill="#6366f1" font-size="10.5">distil</text>

  <!-- ── column 2: vault ── -->
  <rect x="298" y="98" width="200" height="176" rx="12" fill="#0a0c16" stroke="#6366f1" stroke-width="1.4"/>
  <text x="318" y="128" fill="#e9ecf5" font-size="15" font-weight="600">The vault</text>
  <text x="318" y="150" fill="#9aa3bd" font-size="11.5">a folder you own</text>
  <line x1="318" y1="164" x2="478" y2="164" stroke="rgba(148,163,216,0.18)"/>
  <text x="318" y="186" fill="#34d399" font-size="11.5">notes · skills · profile</text>
  <text x="318" y="206" fill="#5b6178" font-size="11">plaintext markdown</text>
  <text x="318" y="232" fill="#22d3ee" font-size="11.5">snapshots</text>
  <text x="318" y="252" fill="#5b6178" font-size="11">AES-256-GCM</text>

  <!-- arrow 2 -->
  <path d="M510 186 L568 186" stroke="#6366f1" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <text x="512" y="176" fill="#6366f1" font-size="10.5">index</text>

  <!-- ── column 3: server ── -->
  <rect x="580" y="98" width="260" height="176" rx="12" fill="#0a0c16" stroke="rgba(148,163,216,0.18)"/>
  <text x="600" y="128" fill="#e9ecf5" font-size="15" font-weight="600">pomnia-core</text>
  <text x="600" y="150" fill="#9aa3bd" font-size="11.5">one Node process, MCP over HTTP</text>
  <line x1="600" y1="164" x2="820" y2="164" stroke="rgba(148,163,216,0.18)"/>
  <text x="600" y="188" fill="#9aa3bd" font-size="11.5">hybrid search · 9 tools</text>
  <text x="600" y="212" fill="#5b6178" font-size="11">full: also distils, needs Ollama</text>
  <text x="600" y="232" fill="#5b6178" font-size="11">appliance: search only, no Ollama</text>
  <text x="600" y="256" fill="#5b6178" font-size="11">runs on a NAS or a small VM</text>

  <!-- back arrow: agents ask -->
  <path d="M700 292 L700 316 L128 316 L128 286" stroke="#22d3ee" stroke-width="1.6" fill="none" marker-end="url(#c)" stroke-dasharray="5 4"/>
  <text x="372" y="336" fill="#22d3ee" font-size="11.5">any MCP agent asks the same corpus</text>

  <text x="40" y="392" fill="#5b6178" font-size="11">The desktop app collects and distils. The server only serves — it never reads your assistants.</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#6366f1"/>
    </marker>
    <marker id="c" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#22d3ee"/>
    </marker>
  </defs>
</svg>
